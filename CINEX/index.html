<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinex - Rediseño</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
        }
    </style>
</head>
<body class="bg-black text-white antialiased">

    <header class="absolute top-0 left-0 w-full z-50 bg-gradient-to-r from-blue-500/20 via-blue-900/30 to-black/40 backdrop-blur-md border-b border-white/10">
        <div class="w-full px-6 lg:px-10 h-14 flex items-center justify-between">
            
            <div class="flex items-center">
                <a href="#" class="flex items-center">
                    <img src="https://www.cinex.com.ve/assets/images/xlogo.png.pagespeed.ic.g7fFsLLvP4.webp" 
                         alt="Cinex Logo" 
                         class="h-5 w-auto object-contain">
                </a>
            </div>

            <nav class="hidden md:flex items-center space-x-8 text-sm font-semibold tracking-wide">
                <a href="#" class="hover:text-yellow-400 transition-colors">CARTELERA</a>
                <a href="#" class="hover:text-yellow-400 transition-colors">DULCERÍA</a>
                <a href="#" class="hover:text-yellow-400 transition-colors">ESTRENOS</a>
                <a href="#" class="hover:text-yellow-400 transition-colors">CINES</a>
                <a href="#" class="hover:text-yellow-400 transition-colors">COMERCIALIZACIÓN</a>
                <a href="#" class="hover:text-yellow-400 transition-colors">CONTÁCTANOS</a>
                <a href="#" class="flex items-center space-x-1 text-yellow-400 hover:opacity-80 transition-opacity">
                    <span class="inline-block w-2 h-2 rounded-full bg-yellow-400 animate-pulse"></span>
                    <span>cinexclusivo</span>
                </a>
            </nav>

            <div>
                <a href="#" class="font-bold text-sm tracking-wider hover:text-yellow-400 transition-colors px-4 py-2 rounded-lg border border-transparent hover:border-white/20">
                    INGRESA
                </a>
            </div>

        </div>
    </header>

    <section class="relative w-full h-[85vh] min-h-[600px] flex items-center overflow-hidden">
        
        <div class="absolute inset-0 z-0 overflow-hidden bg-black">
            <video 
                autoplay 
                loop 
                muted 
                playsinline 
                preload="auto"
                class="absolute top-1/2 left-1/2 min-w-full min-h-full w-auto h-auto -translate-x-1/2 -translate-y-1/2 object-cover opacity-80"
            >
                <source src="spiderman.mp4" type="video/mp4">
                Tu navegador no soporta el formato de video.
            </video>
            
            <div class="absolute inset-0 bg-gradient-to-r from-[#070914]/90 via-[#070914]/50 to-transparent"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-[#070914] via-transparent to-transparent opacity-80"></div>
        </div>

        <div class="relative z-10 w-full px-6 lg:px-10 pt-16 flex flex-col justify-center">
            
            <div class="flex flex-col items-start space-y-6 max-w-md">
                
                <div class="flex flex-col items-center w-full">
                    
                    <img src="https://image.tmdb.org/t/p/original/g4YvZOWYmissloGtaVAeWybkPct.png" 
                         alt="Spider-Man Logo" 
                         class="w-[280px] sm:w-[350px] object-contain drop-shadow-[0_8px_15px_rgba(0,0,0,0.8)]">
                    
                    <div class="flex items-center justify-center gap-x-6 text-sm font-semibold text-white mt-4 w-full drop-shadow-md">
                        <div class="flex items-center space-x-2">
                            <i class="fa-regular fa-clock text-gray-300"></i>
                            <span>145min</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <i class="fa-solid fa-clapperboard text-gray-300"></i>
                            <span>ACCIÓN / FICCIÓN</span>
                        </div>
                        <span class="bg-[#2532bc] text-white font-bold text-xs px-2.5 py-1 rounded">
                            +12
                        </span>
                    </div>

                </div>

                <p class="text-sm sm:text-base text-gray-200 leading-relaxed font-normal text-justify drop-shadow-md w-full">
                    Dividido entre la universidad y su deber, Peter Parker deberá romper la promesa de abandonar el traje cuando una nueva amenaza aceche a sus amigos.
                </p>

                <div class="flex flex-wrap items-center gap-4 pt-2">
                    <a href="#" class="border-[2px] border-white text-white font-bold text-sm px-6 py-2.5 rounded-full hover:bg-white hover:text-black transition-all">
                        ESTRENO 30-07-2026
                    </a>
                    <a href="#" class="bg-[#2532bc] hover:bg-[#1d2799] text-white font-bold text-sm px-8 py-2.5 rounded-full transition-all shadow-lg shadow-blue-900/40">
                        COMPRAR BOLETOS
                    </a>
                </div>

            </div>
        </div>

        <div class="absolute right-6 lg:right-10 z-20 hidden md:flex items-center">
            <button class="text-white/50 hover:text-white transition-colors">
                <svg class="w-16 h-16 drop-shadow-lg" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
        </div>

    </section>

</body>
</html>
